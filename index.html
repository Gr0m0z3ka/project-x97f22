<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto GEX</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0e1116;--card:#171b22;--tx:#e6e9ef;--mu:#8b93a1;--g:#26c281;--r:#ef5350;--ac:#4c8dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:16px;max-width:1100px;margin:auto}
h1{font-size:18px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
button,.chip{background:var(--card);color:var(--tx);border:1px solid #2a303a;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.chip.on,button.on{background:var(--ac);border-color:var(--ac)}
.off{opacity:.4}
.lbl{color:var(--mu);font-size:13px}
.tabs button{flex:1;font-weight:600;padding:9px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:10px;padding:10px}.stat b{display:block;font-size:17px;margin-top:2px}
.stat span{color:var(--mu);font-size:12px}
#chart{background:#101318;border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#tv{height:480px;border-radius:10px;overflow:hidden;background:#101318}
svg{display:block}
.pos{color:var(--g)}.neg{color:var(--r)}#msg,#msg2{color:var(--mu);margin-top:8px;line-height:1.5}
.lv{border-left-width:4px}
.lab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:10px}
.pan{background:var(--card);border-radius:10px;padding:10px;overflow-x:auto}
.pan h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
table.lt{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.lt th{color:var(--mu);font-weight:500;padding:6px 8px;text-align:right}
.lt td{padding:6px 8px;text-align:right}
.lt th:first-child,.lt td:first-child{text-align:left}
.lt tbody tr:nth-child(odd){background:#1c212a}
select{background:var(--card);color:var(--tx);border:1px solid #2a303a;border-radius:8px;padding:6px;font:inherit}
</style></head><body>
<h1>GEX — Gamma Exposure</h1>
<div class="row tabs"><button data-t="gex" class="on">GEX</button><button data-t="chart">График</button><button data-t="lab">DataLab</button></div>
<div class="row" id="rf"></div>
<div class="row" id="coins"></div>
<div class="row" id="exch"></div>
<div id="fx">
  <div class="row" id="exps"></div>
  <div class="row"><button id="all">Все</button><button id="none">Сбросить</button><button id="near">Ближайшая</button></div>
</div>
<div class="stats" id="stats"></div>

<div id="tabGex">
  <div class="row"><button id="zin">＋</button><button id="zout">－</button><button id="zreset">Сброс масштаба</button></div>
  <div id="chart"></div>
</div>
<div id="tabChart" style="display:none">
  <div class="row" id="tfs"></div>
  <div class="row" id="lvs"></div>
  <div id="tv"></div>
  <div id="msg2"></div>
</div>
<div id="tabLab" style="display:none"></div>
<div id="msg">Загрузка…</div>

<script>
const MON={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
const MN=Object.keys(MON),EX=['Deribit','Bybit','OKX'];
let cur='ETH',opts=[],spot=0,exps=[],sel=new Set(),known=new Set(),ex=new Set(EX),raw={},status='';
let D={all:[],negs:[],poss:[],abss:[]},view=[0,1],cpx=null,raf=0,LAY={L:52,R:8,W:600};
let tab='gex',tf='1h',tv=null,cs=null,lines=[],cKey='',cLast=0,lastClose=null;
let auto=60,timer=null,busy=false;
const LV={N1:['#ef5350',2],N2:['#ef5350',2],P1:['#26c281',2],P2:['#26c281',2],A1:['#a06bff',2],A2:['#a06bff',2],Flip:['#f5a623',0],S:['#26c281',0],MP:['#1e6bff',1],Spot:['#ffffff',2]};
let lv=new Set(Object.keys(LV));
const TF={'15m':['15m','15'],'1h':['1h','60'],'4h':['4h','240'],'1d':['1d','D']};
const AUTO=[[0,'Вручную'],[60,'1 мин'],[300,'5 мин']];
const $=id=>document.getElementById(id);
const phi=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
function gamma(S,K,iv,T){const s=iv*Math.sqrt(T);const d1=(Math.log(S/K)+0.5*iv*iv*T)/s;return phi(d1)/(S*s)}
const fmt=n=>{const a=Math.abs(n),s=n<0?'-':'';return a>=1e9?s+'$'+(a/1e9).toFixed(2)+'B':a>=1e6?s+'$'+(a/1e6).toFixed(1)+'M':s+'$'+(a/1e3).toFixed(0)+'K'};
const fm=n=>fmt(n).replace('$','');
const cls=n=>n>=0?'pos':'neg';
const nt=v=>v.c-v.p,ab=v=>v.c+v.p;
const sched=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};

// ---------- парсинг ----------
const parseDate=s=>{const m=s.match(/^(\d{1,2})([A-Z]{3})(\d{2})$/);return m?Date.UTC(2000+ +m[3],MON[m[2]],+m[1],8):null};
const parseYmd=s=>{const m=s.match(/^(\d{2})(\d{2})(\d{2})$/);return m?Date.UTC(2000+ +m[1],+m[2]-1,+m[3],8):null};
const lbl=ts=>{const d=new Date(ts);return d.getUTCDate()+MN[d.getUTCMonth()]+String(d.getUTCFullYear()).slice(2)};
const ivn=x=>{x=+x;return x>5?x/100:x};
const mk=(ts,K,c,oi,iv,x)=>{const T=(ts-Date.now())/31536e6;return(ts&&T>0&&oi>0&&iv>0&&K>0)?{ts,label:lbl(ts),K,c,oi,iv,T,x}:null};
const J=u=>fetch(u).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});

// ---------- биржи ----------
async function ldDeribit(){
  const A='https://www.deribit.com/api/v2/public/';
  const [b,i]=await Promise.all([J(A+'get_book_summary_by_currency?currency='+cur+'&kind=option'),J(A+'get_index_price?index_name='+cur.toLowerCase()+'_usd')]);
  const out=[];
  for(const o of b.result){const p=o.instrument_name.split('-');const r=mk(parseDate(p[1]),+p[2],p[3]==='C',o.open_interest,o.mark_iv/100,'Deribit');if(r)out.push(r)}
  return{spot:i.result.index_price,opts:out};
}
async function ldBybit(){
  const j=await J('https://api.bybit.com/v5/market/tickers?category=option&baseCoin='+cur);
  if(j.retCode!==0)throw new Error(j.retMsg||'ошибка API');
  const L=j.result.list,out=[];
  for(const o of L){const p=o.symbol.split('-');const r=mk(parseDate(p[1]),+p[2],p[3]==='C',+o.openInterest,ivn(o.markIv),'Bybit');if(r)out.push(r)}
  if(!L.length)throw new Error('пустой ответ');
  return{spot:+L[0].indexPrice,opts:out};
}
async function ldOKX(){
  const u=cur+'-USD',A='https://www.okx.com/api/v5/';
  const [s,o,ix]=await Promise.all([J(A+'public/opt-summary?uly='+u),J(A+'public/open-interest?instType=OPTION&uly='+u),J(A+'market/index-tickers?instId='+u)]);
  if(s.code!=='0')throw new Error(s.msg||'ошибка API');
  const oi=new Map(o.data.map(d=>[d.instId,+d.oiCcy||(+d.oi*(cur==='BTC'?0.01:0.1))]));
  const out=[];
  for(const d of s.data){const p=d.instId.split('-');const r=mk(parseYmd(p[2]),+p[3],p[4]==='C',oi.get(d.instId)||0,ivn(d.markVol),'OKX');if(r)out.push(r)}
  return{spot:+ix.data[0].idxPx,opts:out};
}

async function load(reset){
  $('msg').textContent='Загрузка…';
  const prev=new Set(sel);
  const res=await Promise.allSettled([ldDeribit(),ldBybit(),ldOKX()]);
  if(reset)raw={};
  const st=[];
  res.forEach((r,i)=>{
    const n=EX[i];
    if(r.status==='fulfilled'){raw[n]=r.value;st.push(n+' ✓ '+r.value.opts.length)}
    else if(raw[n])st.push(n+' ✗ '+((r.reason&&r.reason.message)||'ошибка')+' (оставил прежние данные)');
    else st.push(n+' ✗ '+((r.reason&&r.reason.message)||'ошибка')+' (блок CORS/региона?)');
  });
  if(!Object.keys(raw).length){$('msg').textContent='Ошибка загрузки: '+st.join(' · ');return}
  status=st.join(' · ')+' · '+new Date().toLocaleTimeString();
  rebuild(reset?null:prev);ui();compute();if(reset)resetView();draw();
  $('msg').innerHTML=status+'<br>GEX: тяни — сдвиг, щипок/колесо — масштаб, двойной тап — сброс.';
}
function rebuild(keep){
  opts=[];for(const k of EX)if(ex.has(k)&&raw[k])opts.push(...raw[k].opts);
  const src=EX.find(k=>raw[k]);if(src)spot=raw[src].spot;
  exps=[...new Map(opts.map(o=>[o.ts,o.label])).entries()].sort((a,b)=>a[0]-b[0]);
  const now=new Set(exps.map(e=>e[0]));
  if(keep){const ns=new Set();for(const t of now)if(keep.has(t)||!known.has(t))ns.add(t);sel=ns.size?ns:new Set(now)}
  else sel=new Set(now);
  known=now;
}
function ui(){
  $('rf').innerHTML='<span class="lbl">Обновление:</span>'+AUTO.map(a=>`<span class="chip ${a[0]===auto?'on':''}" data-a="${a[0]}">${a[1]}</span>`).join('')+'<button id="refresh">↻ Обновить</button>';
  $('coins').innerHTML=['BTC','ETH'].map(c=>`<button class="${c===cur?'on':''}" data-c="${c}">${c}</button>`).join('');
  $('exch').innerHTML=EX.map(k=>`<span class="chip ${ex.has(k)?'on':''} ${raw[k]?'':'off'}" data-x="${k}">${k}</span>`).join('');
  $('exps').innerHTML=exps.map(e=>`<span class="chip ${sel.has(e[0])?'on':''}" data-e="${e[0]}">${e[1]}</span>`).join('');
  $('tfs').innerHTML=Object.keys(TF).map(k=>`<button class="${k===tf?'on':''}" data-tf="${k}">${k}</button>`).join('');
  $('lvs').innerHTML=Object.keys(LV).map(k=>`<span class="chip lv ${lv.has(k)?'on':''}" style="border-left-color:${LV[k][0]}" data-l="${k}">${k}</span>`).join('');
}
function totalAt(S,list){let t=0;for(const o of list)t+=(o.c?1:-1)*gamma(S,o.K,o.iv,o.T)*o.oi*S*S*0.01;return t}

function compute(){
  const list=opts.filter(o=>sel.has(o.ts));
  const by=new Map();let cg=0,pg=0;
  for(const o of list){const g=gamma(spot,o.K,o.iv,o.T)*o.oi*spot*spot*0.01;
    const v=by.get(o.K)||{c:0,p:0};o.c?v.c+=g:v.p+=g;by.set(o.K,v);o.c?cg+=g:pg-=g}
  const net=cg+pg,absT=cg-pg;let flip=null,stab=null;
  if(list.length){let prev=null,best=-Infinity;
    for(let k=0;k<=100;k++){const S=spot*(0.7+0.006*k),t=totalAt(S,list);
      if(flip==null&&prev&&Math.sign(prev.t)!==Math.sign(t))flip=prev.S+(S-prev.S)*(0-prev.t)/(t-prev.t);
      if(t>best){best=t;stab=S}prev={S,t}}
    if(!(best>0))stab=null}
  let mp=null;const ks=[...by.keys()].sort((a,b)=>a-b);
  if(ks.length){let best=Infinity;
    for(const K of ks){let pay=0;for(const o of list)pay+=o.oi*(o.c?Math.max(0,K-o.K):Math.max(0,o.K-K));
      if(pay<best){best=pay;mp=K}}}
  $('stats').innerHTML=`<div class="stat"><span>Spot</span><b>$${spot.toFixed(0)}</b></div>
  <div class="stat"><span>Net GEX / 1%</span><b class="${cls(net)}">${fmt(net)}</b></div>
  <div class="stat"><span>Absolute GEX</span><b>${fmt(absT)}</b></div>
  <div class="stat"><span>Call GEX</span><b class="pos">${fmt(cg)}</b></div>
  <div class="stat"><span>Put GEX</span><b class="neg">${fmt(pg)}</b></div>
  <div class="stat"><span>Gamma Flip (V)</span><b>${flip?'$'+flip.toFixed(0):'—'}</b></div>
  <div class="stat"><span>Max Stability (S)</span><b class="pos">${stab?'$'+stab.toFixed(0):'—'}</b></div>
  <div class="stat"><span>Max Pain</span><b>${mp?'$'+mp:'—'}</b></div>`;
  const all=[...by.entries()].sort((a,b)=>a[0]-b[0]);
  const base=all.filter(r=>r[0]>=spot*0.7&&r[0]<=spot*1.3);
  D={all,flip,stab,mp,
    negs:base.filter(r=>nt(r[1])<0).sort((a,b)=>nt(a[1])-nt(b[1])).slice(0,2),
    poss:base.filter(r=>nt(r[1])>0).sort((a,b)=>nt(b[1])-nt(a[1])).slice(0,2),
    abss:[...base].sort((a,b)=>ab(b[1])-ab(a[1])).slice(0,2)};
  updateLevels();
  snap();
  if(tab==='lab')renderLab();
}
function setView(a,b){
  if(D.all.length<2)return;
  const kmin=D.all[0][0],kmax=D.all[D.all.length-1][0],full=kmax-kmin,minS=Math.min(spot*0.02,full);
  const s=Math.min(Math.max(b-a,minS),full),c=(a+b)/2;a=c-s/2;b=c+s/2;
  if(a<kmin){b+=kmin-a;a=kmin}if(b>kmax){a-=b-kmax;b=kmax}
  view=[a,b];
}
function resetView(){setView(spot*0.7,spot*1.3)}
function zoomAt(p,f){setView(p-(p-view[0])*f,p+(view[1]-p)*f)}
const px2p=px=>view[0]+(px-LAY.L)/(LAY.W-LAY.L-LAY.R)*(view[1]-view[0]);

// ---------- вкладка GEX ----------
function draw(){
  if(tab!=='gex')return;
  const ch=$('chart'),all=D.all;
  if(all.length<2){ch.innerHTML='';return}
  const W=Math.max(320,ch.clientWidth),H=680,L=52,R=8,P1={t:28,b:330},P2={t:370,b:590},PW=W-L-R;
  LAY={L,R,W};
  const [v0,v1]=view,span=v1-v0,xs=p=>L+(p-v0)/span*PW;
  const m=Math.max(span*0.05,spot*0.014);
  const vis=all.filter(r=>r[0]>=v0-m&&r[0]<=v1+m),inn=vis.filter(r=>r[0]>=v0&&r[0]<=v1);
  const yr=inn.length?inn:vis;
  const nets=yr.map(r=>nt(r[1])),nmin=Math.min(0,...nets),nmax=Math.max(0,...nets);
  const ny=v=>P1.t+(nmax-v)/((nmax-nmin)||1)*(P1.b-P1.t);
  let gap=Infinity;for(let i=1;i<vis.length;i++)gap=Math.min(gap,vis[i][0]-vis[i-1][0]);
  const bw=Math.min(28,Math.max(2,gap/span*PW*0.7));
  const w=spot*0.0035,N=Math.min(300,Math.floor(PW/2)),tot=[],put=[];let amax=0;
  for(let i=0;i<=N;i++){const p=v0+span*i/N;let a=0,b=0;
    for(const r of vis){const d=(p-r[0])/w;if(Math.abs(d)>4)continue;const e=Math.exp(-0.5*d*d);a+=ab(r[1])*e;b+=r[1].p*e}
    tot.push([p,a]);put.push([p,b]);if(a>amax)amax=a}
  amax=amax||1;
  const ay=v=>P2.b-v/amax*(P2.b-P2.t);
  const path=(c,close)=>{const d=c.map((q,i)=>(i?'L':'M')+xs(q[0]).toFixed(1)+','+ay(q[1]).toFixed(1)).join(' ');
    return close?d+` L${xs(v1)},${P2.b} L${xs(v0)},${P2.b} Z`:d};
  const pill=(x,y,t,c)=>{if(x<L||x>W-R)return '';const w=t.length*9+14;
    return `<rect x="${x-w/2}" y="${y-11}" width="${w}" height="22" rx="11" fill="${c}"/><text x="${x}" y="${y+5}" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">${t}</text>`};
  const zone=(pr,c)=>{if(pr.length<2)return '';const a=xs(Math.min(pr[0][0],pr[1][0])),b=xs(Math.max(pr[0][0],pr[1][0]));
    return `<rect x="${a}" y="${P1.t}" width="${b-a}" height="${P2.b-P1.t}" fill="${c}"/>`};

  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><clipPath id="cp"><rect x="${L}" y="0" width="${PW}" height="${H}"/></clipPath></defs>`;
  s+=`<text transform="translate(14,${(P1.t+P1.b)/2}) rotate(-90)" fill="#8b93a1" font-size="12" text-anchor="middle">Net GEX per 1% move</text>`;
  s+=`<text transform="translate(14,${(P2.t+P2.b)/2}) rotate(-90)" fill="#8b93a1" font-size="12" text-anchor="middle">Abs. GEX</text>`;
  for(let i=0;i<=4;i++){const v=nmin+(nmax-nmin)*i/4,y=ny(v);
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#1d222b"/><text x="${L-5}" y="${y+4}" fill="#8b93a1" font-size="11" text-anchor="end">${fm(v)}</text>`}
  for(let i=0;i<=3;i++){const v=amax*i/3,y=ay(v);
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#1d222b"/><text x="${L-5}" y="${y+4}" fill="#8b93a1" font-size="11" text-anchor="end">${fm(v)}</text>`}
  s+=`<g clip-path="url(#cp)">`;
  s+=zone(D.negs,'rgba(239,83,80,.15)')+zone(D.abss,'rgba(124,58,237,.18)');
  s+=`<line x1="${L}" x2="${W-R}" y1="${ny(0)}" y2="${ny(0)}" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  vis.forEach(([k,v])=>{const d=nt(v),y=ny(d),y0=ny(0);
    s+=`<rect x="${xs(k)-bw/2}" y="${Math.min(y,y0)}" width="${bw}" height="${Math.abs(y-y0)||1}" fill="${d>=0?'#2e9e6b':'#d9303f'}"/>`});
  s+=`<path d="${path(tot,true)}" fill="rgba(124,58,237,.35)"/><path d="${path(tot)}" fill="none" stroke="#8b4dff" stroke-width="2.5"/>`;
  s+=`<path d="${path(put,true)}" fill="rgba(236,72,153,.25)"/><path d="${path(put)}" fill="none" stroke="#e0409a" stroke-width="2.5"/>`;
  const vl=(p,c,d)=>`<line x1="${xs(p)}" x2="${xs(p)}" y1="${P1.t}" y2="${P2.b}" stroke="${c}" stroke-width="2.5" stroke-dasharray="${d}"/>`;
  s+=vl(spot,'#fff','4 4');if(D.flip)s+=vl(D.flip,'#ef5350','6 4');if(D.stab)s+=vl(D.stab,'#26c281','6 4');if(D.mp)s+=vl(D.mp,'#1e6bff','2 4');
  D.negs.forEach((r,i)=>s+=pill(xs(r[0]),ny(nt(r[1]))+16,'N'+(i+1),'#d9303f'));
  D.poss.forEach((r,i)=>s+=pill(xs(r[0]),ny(nt(r[1]))-16,'P'+(i+1),'#1f8f5f'));
  D.abss.forEach((r,i)=>s+=pill(xs(r[0]),ay(ab(r[1]))-14,'A'+(i+1),'#5b21b6'));
  if(D.flip)s+=pill(xs(D.flip),(P1.b+P2.t)/2,'V','#d9303f');
  if(D.stab)s+=pill(xs(D.stab),P1.t-6,'S','#1f8f5f');
  if(D.mp)s+=pill(xs(D.mp),ny(0)+(nmax>0?-14:18),'MP','#1e6bff');
  s+=`</g>`;
  const raw2=span/6,mag=Math.pow(10,Math.floor(Math.log10(raw2)));
  const step=[1,2,2.5,5,10].map(q=>q*mag).find(q=>q>=raw2);
  for(let i=Math.ceil(v0/step);i*step<=v1;i++){const p=i*step;
    s+=`<text x="${xs(p)}" y="${P2.b+18}" fill="#8b93a1" font-size="12" text-anchor="middle">${step>=1000?+(p/1000).toFixed(2)+'k':p.toLocaleString('en-US')}</text>`}
  if(spot>=v0&&spot<=v1)s+=`<text x="${Math.min(Math.max(xs(spot),L+40),W-R-40)}" y="${P2.b+70}" fill="#fff" font-size="12" text-anchor="middle">Spot ${spot.toFixed(0)}</text>`;
  if(cpx!=null&&cpx>=L&&cpx<=W-R&&inn.length){
    const p=px2p(cpx);let best=inn[0];for(const r of inn)if(Math.abs(r[0]-p)<Math.abs(best[0]-p))best=r;
    const k=best[0],v=best[1],x=xs(k);
    s+=`<line x1="${x}" x2="${x}" y1="${P1.t}" y2="${P2.b}" stroke="#fff" stroke-width="1.5" opacity=".9"/>`;
    const bx=x+8+150>W-R?x-158:x+8;
    s+=`<rect x="${bx}" y="${P1.t}" width="150" height="68" rx="6" fill="rgba(20,24,31,.93)" stroke="#2a303a"/>`;
    [`Strike ${k.toLocaleString('en-US')}`,`Net ${fmt(nt(v))}`,`C ${fmt(v.c)} / P ${fmt(-v.p)}`,`Abs ${fmt(ab(v))}`].forEach((t,i)=>
      s+=`<text x="${bx+8}" y="${P1.t+16+i*15}" fill="#e6e9ef" font-size="12">${t}</text>`);

function solve3(A,b){
  for(let i=0;i<3;i++){let m=i;for(let r=i+1;r<3;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    [A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];if(Math.abs(A[i][i])<1e-14)return null;
    for(let r=i+1;r<3;r++){const f=A[r][i]/A[i][i];for(let c=i;c<3;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
  const x=[0,0,0];for(let i=2;i>=0;i--){let s=b[i];for(let c=i+1;c<3;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i]}return x;
}
// улыбка IV по OTM-опционам, квадратичная аппроксимация в log-moneyness
function fitExp(g,T){
  const pts=[];
  for(const o of g){if(o.c!==(o.K>=spot))continue;pts.push([Math.log(o.K/spot),o.iv,Math.sqrt(o.oi)])}
  if(pts.length<4)return null;
  const ivs=pts.map(p=>p[1]).sort((a,b)=>a-b),sg=ivs[ivs.length>>1],R=Math.max(0.12,1.6*sg*Math.sqrt(T));
  const P=pts.filter(p=>Math.abs(p[0])<=R);if(P.length<4)return null;
  const A=[[0,0,0],[0,0,0],[0,0,0]],b=[0,0,0];
  for(const [k,v,w] of P){const x=[1,k,k*k];for(let i=0;i<3;i++){b[i]+=w*x[i]*v;for(let j=0;j<3;j++)A[i][j]+=w*x[i]*x[j]}}
  const c=solve3(A,b);if(!c)return null;
  const f=k=>c[0]+c[1]*k+c[2]*k*k,ks=P.map(p=>p[0]),k0=Math.min(...ks)-0.02,k1=Math.max(...ks)+0.02,cl=k=>Math.min(Math.max(k,k0),k1);
  const atm=f(0);if(!(atm>0.01))return null;
  const q=0.6745,sT=Math.sqrt(T);let sc=atm,sp=atm,kc=0,kp=0;
  for(let i=0;i<25;i++){kc=q*sc*sT+0.5*sc*sc*T;kp=-q*sp*sT+0.5*sp*sp*T;const a=f(cl(kc)),d=f(cl(kp));if(a>0.01)sc=a;if(d>0.01)sp=d}
  const ok=kc>=k0&&kc<=k1&&kp>=k0&&kp<=k1;
  return{atm:atm*100,rr:ok?(sc-sp)*100:null,fly:ok?((sc+sp)/2-atm)*100:null};
}
function curve(){
  const m=new Map();for(const o of opts){if(!m.has(o.ts))m.set(o.ts,[]);m.get(o.ts).push(o)}
  const out=[];
  for(const [ts,g] of [...m].sort((a,b)=>a[0]-b[0])){const T=(ts-Date.now())/31536e6;if(T<=0)continue;const f=fitExp(g,T);if(f)out.push({ts,T,label:g[0].label,...f})}
  return out;
}
function atTen(cv,d,key){
  const tau=d/365;if(!cv.length)return null;if(tau<=cv[0].T)return cv[0][key];
  for(let i=0;i<cv.length-1;i++){const a=cv[i],b=cv[i+1];
    if(tau<=b.T){const x=(tau-a.T)/(b.T-a.T);if(a[key]==null||b[key]==null)return null;
      if(key==='atm')return Math.sqrt((a.atm*a.atm*a.T*(1-x)+b.atm*b.atm*b.T*x)/tau);
      return a[key]+(b[key]-a[key])*x}}
  return null;
}

    a.push(row);localStorage.setItem(skey(),JSON.stringify(a.filter(r=>n-r.t<36*864e5)));

}
function chgIV(key,i,v,days){
  if(v==null)return null;
  const a=snaps(),n=Date.now(),h=days*864e5;let best=null;
  for(const r of a){const age=n-r.t;if(age>=h*0.9&&age<=h*1.6&&(best==null||age<n-best.t))best=r}

}

  $('tkbk').innerHTML=`<table class="tkn"><thead><tr><th>Цена</th><th>Кол-во[${cur}]</th><th>Всего[${cur}]</th></tr></thead><tbody>${[...A].reverse().map(x=>row(x,'#ef5350','rgba(239,83,80,.45)')).join('')}
  <tr><td colspan="3" style="text-align:center;padding:.6em 0"><b>${r.mark.toFixed(1)}</b> <small style="color:#8b93a1">Маркировка ${r.iv.toFixed(2)}%</small> &nbsp; <b>${md.toFixed(1)}</b> <small style="color:#8b93a1">Модель</small> &nbsp; <small style="color:#8b93a1">Последний</small> <b>${f(r.last)}</b></td></tr>
  ${B.map(x=>row(x,'#26c281','rgba(38,194,129,.45)')).join('')}</tbody></table>${tkOB?'':'<div class="lbl">Загрузка стакана…</div>'}`;
  $('tktr').innerHTML=tk.tab==='chart'?tkChart():`<table class="tkn"><thead><tr><th>Цена</th><th>Кол-во[${cur}]</th><th>Время</th></tr></thead><tbody>${tkTr.slice(0,12).map(x=>`<tr><td style="color:${x.side==='Buy'?'#26c281':'#ef5350'}">${(+x.price).toFixed(1)}</td><td>${(+x.size).toFixed(1)}</td><td>${new Date(+x.time).toLocaleString('sv-SE')}</td></tr>`).join('')||'<tr><td colspan="3" style="color:#8b93a1">Нет сделок</td></tr>'}</tbody></table>`;
}
async function tkPoll(first){
  if(!tk||tkBusy)return;tkBusy=true;const s=tk.sym,n=Date.now(),B='https://api.bybit.com/v5/market/';
  const jobs=[J(B+'orderbook?category=option&symbol='+s+'&limit=25').then(j=>{if(j.retCode===0)tkOB={a:j.result.a,b:j.result.b}}).catch(()=>{})];
  if(first||n-tkT>5000){tkT=n;
    jobs.push(J(B+'tickers?category=option&symbol='+s).then(j=>{const o=j.result.list[0];if(o)tkSt={hi:+o.highPrice24h,lo:+o.lowPrice24h}}).catch(()=>{}),
      J(B+'recent-trade?category=option&symbol='+s+'&limit=50').then(j=>{if(j.retCode===0)tkTr=j.result.list}).catch(()=>{}))}
  await Promise.all(jobs);tkBusy=false;if(tk&&tk.sym===s)tkDyn();
}
setInterval(()=>tkPoll(),1000);
tkEl.addEventListener('click',e=>{
  if(e.target===tkEl)return closeTk();
  const d=e.target.closest('[data-tkx],[data-tm],[data-ts],[data-tp],[data-tt],[data-tadd]');if(!d||!tk)return;const q=d.dataset;
  if(q.tkx!==undefined)return closeTk();
  if(q.tm){tk.mode=q.tm;return tkBuild()}
  if(q.tt){tk.tab=q.tt;return tkDyn(),tkBuild()}
  if(q.ts){const [k,s]=q.ts.split('|');if(k==='p')tk.price=Math.max(0,+(tk.price+ +s*.5).toFixed(2));else tk.qty=Math.max(0,+((+tk.qty||0)+ +s*.1).toFixed(2));return tkBuild()}
  if(q.tp){tk.price=+q.tp;return tkBuild()}
  if(q.tadd){const s=+q.tadd;legs.push({sym:tk.sym,s,q:+tk.qty||1,pmode:tk.mode==='mkt'?'mkt':'fix',fu:'usdt',fp:tk.price});sv();
    const m=$('tkmsg');if(m)m.textContent='✓ '+(s>0?'Купить':'Продать')+' добавлено в «Аналитик»';tkDyn()}});
tkEl.addEventListener('input',e=>{const t=e.target,r=tkR();if(!tk||!r)return;
  if(t.id==='tkp'){tk.price=+t.value||0;$('tki').value=ivOf(tk.price,r.K,r.T,r.c,bb.idx).toFixed(1)}
  else if(t.id==='tki'){tk.price=+bs(bb.idx,r.K,r.T,(+t.value||0)/100,r.c).toFixed(1);$('tkp').value=tk.price}
  else if(t.id==='tkq')tk.qty=t.value;
  tkDyn()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tk)closeTk()});
// ---------- вкладки и обновление ----------
async function upd(){
  if(!bb||bb.key!==cur||Date.now()-bb.t>4500)await ldBB();
  if(tab==='desk')renderDesk();else if(tab==='pos')renderPos();
}
const _st=setTab;
setTab=function(t){const m=t==='desk'||t==='pos';document.body.classList.toggle('w',m);
  D.style.display=t==='desk'?'':'none';P.style.display=t==='pos'?'':'none';
  if(!m){_st(t);return}
  tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  for(const id of['tabGex','tabChart','tabLab','fx','stats'])$(id).style.display='none';
  if(ready())t==='desk'?renderDesk():renderPos();else wait(t==='desk'?D:P);
  upd()};
setInterval(()=>{if(tab==='desk'||tab==='pos')upd()},5000);
setInterval(updOB,1000);
})();
ui();
load(true);
setAuto(60);
</script></body></html>
